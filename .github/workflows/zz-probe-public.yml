name: zz-probe-public
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "public probe alive $(date -u +%FT%TZ)"
